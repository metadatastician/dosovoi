# SPDX-License-Identifier: MPL-2.0

[workspace]
members = ["crates/dosovoi-core", "crates/dosovoi-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MPL-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

